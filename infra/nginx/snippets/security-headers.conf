# Header owners: Nginx sends HSTS and nosniff (it terminates TLS and serves /media/public and /_next/static itself);
# next.config.ts sends X-Frame-Options, Referrer-Policy and Permissions-Policy. Never set a header in both places.
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
add_header X-Content-Type-Options nosniff always;
