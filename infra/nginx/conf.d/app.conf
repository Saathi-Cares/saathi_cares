upstream app { server app:3000; keepalive 16; }

server {
  listen 80 default_server;
  server_name _;
  location = /nginx-health { access_log off; return 200 "ok\n"; }
  location / { return 301 https://$host$request_uri; }
}

server {
  listen 443 ssl;
  http2 on;
  server_name cares.saathiventures.com;

  ssl_certificate     /etc/nginx/certs/origin.pem;
  ssl_certificate_key /etc/nginx/certs/origin-key.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;

  include /etc/nginx/snippets/security-headers.conf;

  # limit_req rejections: Retry-After and the PLAN.md §9.4 error envelope (src/server/http/errors.ts), not Nginx's HTML.
  # Retry-After per zone: each limited location sets $retry_after; this is the default for any that does not.
  set $retry_after 60;
  error_page 429 = @rate_limited;
  location @rate_limited {
    default_type application/json;
    add_header Retry-After $retry_after always;
    include /etc/nginx/snippets/security-headers.conf;
    return 429 '{"error":{"code":"RATE_LIMITED","message":"Too many requests","request_id":"$request_id"}}';
  }

  # A location with its own add_header inherits none from the server block, so these two repeat the snippet.
  location /media/public/ {
    alias /srv/media/public/;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, immutable, max-age=31536000";
    try_files $uri =404;
  }

  location /_next/static/ {
    proxy_pass http://app;
    include /etc/nginx/snippets/proxy.conf;
    proxy_hide_header Cache-Control;   # Next sends its own; one Cache-Control on the wire
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, immutable, max-age=31536000";
  }

  # Only the login endpoint (PLAN.md §4.2) spends the 5/min budget; other /api/v1/auth/ paths fall to /api/ below.
  location = /api/v1/auth/login { set $retry_after 60; limit_req zone=login burst=5 nodelay; proxy_pass http://app; include /etc/nginx/snippets/proxy.conf; }
  location = /api/v1/enquiries { set $retry_after 60; limit_req zone=public_forms burst=3 nodelay; proxy_pass http://app; include /etc/nginx/snippets/proxy.conf; }
  location /api/ { set $retry_after 1; limit_req zone=api burst=40 nodelay; proxy_pass http://app; include /etc/nginx/snippets/proxy.conf; }

  location ~ /\.(git|env) { deny all; }

  location / { proxy_pass http://app; include /etc/nginx/snippets/proxy.conf; }
}
