# Staging is a second compose project on the shared `saathi_edge` network and is usually stopped (`down` after UAT).
# A plain `server staging-app-1:3000;` is resolved once at start, and when that name does not exist Nginx refuses to
# start ("host not found in upstream"), taking production down with it. `resolve` (open source since 1.27.3)
# re-resolves the name through Docker's DNS at run time instead: while staging is stopped this host returns 502, and it
# answers again once staging-app-1 is up. deploy-remote.sh still reloads Nginx after starting staging (harmless, and it
# drops idle keepalive connections to an old container). Documented in infra/nginx/README.md.
upstream staging {
  zone staging 64k;
  resolver 127.0.0.11 valid=60s ipv6=off;
  server staging-app-1:3000 resolve;
  keepalive 4;
}

server {
  listen 443 ssl;
  http2 on;
  server_name staging.cares.saathiventures.com;

  ssl_certificate     /etc/nginx/certs/origin.pem;
  ssl_certificate_key /etc/nginx/certs/origin-key.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  include /etc/nginx/snippets/security-headers.conf;
  add_header X-Robots-Tag "noindex" always;
  auth_basic "staging";
  auth_basic_user_file /etc/nginx/certs/staging.htpasswd;

  location / { proxy_pass http://staging; include /etc/nginx/snippets/proxy.conf; }
}
