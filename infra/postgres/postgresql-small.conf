# Staging (infra/compose.staging.yaml): postgresql.conf with smaller memory and connection limits.
listen_addresses = '*'
max_connections = 30
shared_buffers = 128MB
effective_cache_size = 512MB
work_mem = 16MB
maintenance_work_mem = 256MB
random_page_cost = 1.1
wal_compression = on
shared_preload_libraries = 'pg_stat_statements'
password_encryption = scram-sha-256
log_min_duration_statement = 1000
# why: a slow statement is logged with its bind parameters (PG16 default -1 = all of them), which carry PHI.
log_parameter_max_length = 0
log_line_prefix = '%m [%p] %u@%d '
