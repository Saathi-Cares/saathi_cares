# Production stack (project "saathi"). On the VPS:
#   docker compose -f infra/compose.yaml --env-file /srv/saathi/.env.prod --profile core up -d
# Variables: infra/.env.compose.example. Staging overlays infra/compose.staging.yaml; a developer laptop
# overlays infra/compose.dev.yaml with --profile dev (Postgres and Mailpit only).
name: saathi

x-logging: &logging
  driver: json-file
  options: { max-size: '50m', max-file: '10' }

x-common: &common
  restart: unless-stopped
  security_opt: ['no-new-privileges:true']
  logging: *logging

services:
  postgres:
    <<: *common
    image: postgres:16-alpine
    profiles: ['core', 'dev']
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      SAATHI_OWNER_PASSWORD: ${SAATHI_OWNER_PASSWORD:?set in .env}
      SAATHI_APP_PASSWORD: ${SAATHI_APP_PASSWORD:?set in .env}
    command: ['postgres', '-c', 'config_file=/etc/postgresql/postgresql.conf']
    volumes:
      - ${DATA_ROOT:-/srv/saathi}/pgdata:/var/lib/postgresql/data
      - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    mem_limit: 1536m
    # Over TCP, not the socket: on first start the entrypoint runs init.sql on a temporary socket-only server,
    # which a socket check reports as ready; `migrate` then hit ECONNREFUSED when that server stopped.
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U postgres -d saathi']
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [internal]

  migrate:
    image: ghcr.io/saathi-cares/app:${IMAGE_TAG:-latest}
    profiles: ['core']
    restart: 'no'
    security_opt: ['no-new-privileges:true']
    logging: *logging
    command: ['node', 'dist/migrate.js']
    environment:
      DATABASE_URL_MIGRATIONS: postgres://saathi_owner:${SAATHI_OWNER_PASSWORD:?set in .env}@postgres:5432/saathi
    depends_on:
      postgres: { condition: service_healthy }
    mem_limit: 256m
    networks: [internal]

  app:
    <<: *common
    image: ghcr.io/saathi-cares/app:${IMAGE_TAG:-latest}
    profiles: ['core']
    # The app reads only these variables (src/server/config.ts).
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://saathi_app:${SAATHI_APP_PASSWORD:?set in .env}@postgres:5432/saathi
      LOG_LEVEL: ${LOG_LEVEL:-info}
      MEDIA_ROOT: /data/media
      JOBS_ENABLED: 'true'
      JOBS_CONCURRENCY: '2'
    volumes:
      - ${DATA_ROOT:-/srv/saathi}/media:/data/media
    read_only: true
    # The standalone output has no .next/cache; with read_only the tmpfs is where Next writes its cache (uid 1001).
    tmpfs: ['/tmp', '/app/.next/cache:uid=1001,gid=1001']
    depends_on:
      migrate: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
    mem_limit: 768m
    # Readiness, not liveness (PLAN.md §15.2): unhealthy while the database or media storage is unavailable.
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/api/health/ready']
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    networks: [internal, edge]

  nginx:
    <<: *common
    image: nginx:1.27-alpine
    profiles: ['core']
    ports: ['80:80', '443:443']
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - ${DATA_ROOT:-/srv/saathi}/certs:/etc/nginx/certs:ro
      - ${DATA_ROOT:-/srv/saathi}/media/public:/srv/media/public:ro
    depends_on:
      app: { condition: service_healthy }
    mem_limit: 64m
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1/nginx-health']
      interval: 30s
      timeout: 3s
      retries: 3
    networks: [edge]

  backup:
    <<: *common
    build: ./backup
    image: saathi-cares/backup:local
    profiles: ['core']
    environment:
      PGHOST: postgres
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      PGDATABASE: saathi
      RESTIC_REPOSITORY: /backups/restic
      RESTIC_PASSWORD: ${RESTIC_PASSWORD}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL}
    volumes:
      - ${DATA_ROOT:-/srv/saathi}/backups:/backups
      - ${DATA_ROOT:-/srv/saathi}/media:/data/media:ro
    depends_on:
      postgres: { condition: service_healthy }
    mem_limit: 128m
    networks: [internal]

# `internal: true` makes the database network unreachable from outside Docker; only nginx publishes ports.
networks:
  internal: { internal: true }
  edge: {}
