version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: monthly }
    groups: { all: { patterns: ['*'] } }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
  - package-ecosystem: docker
    directory: /
    schedule: { interval: monthly }
  - package-ecosystem: docker
    directory: /infra/backup
    schedule: { interval: monthly }
  - package-ecosystem: docker-compose
    directory: /infra
    schedule: { interval: monthly }
