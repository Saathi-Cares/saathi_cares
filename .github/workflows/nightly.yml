name: nightly
on:
  schedule: [{ cron: '30 21 * * *' }] # 03:00 IST
  workflow_dispatch:
permissions: { contents: read }
jobs:
  full:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: saathi_test }
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 10
    # As in ci.yml; JOBS_ENABLED stays false until an e2e test exercises jobs.
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/saathi_test
      MEDIA_ROOT: ./.test-media
      JOBS_ENABLED: 'false'
      LOG_LEVEL: warn
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm audit --audit-level=high
      - run: docker build -t app:nightly .
      # Report: every HIGH and CRITICAL finding, fixed or not, as JSON (kept 90 days) and as a table in this log.
      - name: Trivy report (HIGH, CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: 'app:nightly'
          severity: 'HIGH,CRITICAL'
          exit-code: '0'
          format: json
          output: trivy-report.json
      - name: Print the Trivy report
        run: trivy convert --format table trivy-report.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with: { name: trivy-report, path: trivy-report.json, retention-days: 90 }
      # Gate: a CRITICAL vulnerability that has a fix fails the job, so GitHub emails the owner (PLAN.md §11).
      - name: Trivy gate (CRITICAL with a fix available)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: 'app:nightly'
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table
          skip-setup-trivy: true
      # The webhook stays in this step's env only (npm ci, the build and e2e never see it). A step's `if` cannot read
      # its own env, and `secrets` is not allowed in `if`, so the script exits quietly when the secret is not set.
      - name: Slack notice
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then echo "SLACK_WEBHOOK_URL is not set; no Slack notice"; exit 0; fi
          if [ -f trivy-report.json ]; then
            count() { jq --arg s "$1" '[.Results[]?.Vulnerabilities[]? | select(.Severity == $s)] | length' trivy-report.json; }
            counts="CRITICAL $(count CRITICAL), HIGH $(count HIGH)"
          else
            counts="no Trivy report (an earlier step failed)"
          fi
          level=OK; [ "$JOB_STATUS" = success ] || level=ALERT
          text="[$level] nightly: $JOB_STATUS; Trivy $counts ($RUN_URL)"
          curl -sS -m 10 -X POST -H 'Content-type: application/json' --data "$(jq -cn --arg t "$text" '{text:$t}')" "$SLACK_WEBHOOK_URL" >/dev/null || echo "Slack post failed"
